apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
spec:
  replicas: 5
  selector:
    matchLabels: 
      app: shortener
  template:
    metadata:
      labels:
        app: shortener
    spec:
      containers:
        - name: shortener
          image: shortener:v3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
--- 
apiVersion: v1
kind: Service
metadata:
  name: shortener
spec:
  type: NodePort
  selector:
    app: shortener
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shortener
spec:
  selector:
    matchLabels:
      app: shortener
  podMetricsEndpoints:
    - port: http
      path: /metrics