---
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
stringData:
  password: "devpassword"
  url: "postgres://shortener:devpassword@postgres:5432/shortener?sslmode=disable"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-init
data:
  init.sql: CREATE TABLE IF NOT EXISTS urls (code TEXT PRIMARY KEY, url TEXT NOT NULL, created_at TIMESTAMPZ NOT NULL DEFAULT now());
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: 
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "shortener"
            - name: POSTGRESS_DB
              value: "shortener"
            - name: POSTGRESS_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: pg-secret
                  key: password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shortener", "-d", "shortener"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: pg-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi